  IORANA - pagina unica
  ---------------------------------------------------------------
  UN FILE SOLO. Il logo e' incorporato qui dentro: non serve
  caricare nessuna immagine. Metti questo file sul dominio con
  il nome  index.html  e basta.
  Opzionale: carica anche  favicon.png  nella stessa cartella,
  per l'icona nella linguetta del browser.

  COSA PUOI CAMBIARE, e dove:

<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IORANA</title>
<meta name="description" content="IORANA - edizioni.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#080808;
    --bronzo:#b08144;
    --bronzo-chiaro:#d4a869;
    --testo:#e8e2d8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}

  html,body{height:100%;margin:0}

  body{
    background:var(--nero);
    color:var(--testo);
    font-family:"EB Garamond",Garamond,"Times New Roman",serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 1.5rem;
    background-image:radial-gradient(circle at 50% 38%,rgba(176,129,68,.16) 0%,rgba(176,129,68,.05) 34%,transparent 64%);
  }

  .logo{
    width:clamp(190px,42vw,330px);
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto 2.8rem;
    opacity:0;
    animation:entra 1.6s ease-out .15s forwards;
  }

  .claim{
    font-size:clamp(1.35rem,4.4vw,2.3rem);
    font-weight:400;
    font-style:italic;
    line-height:1.35;
    letter-spacing:.01em;
    margin:0 0 3rem;
    max-width:22ch;
    opacity:0;
    animation:entra 1.6s ease-out .55s forwards;
  }

  .riga{
    width:clamp(70px,14vw,120px);
    height:1px;
    border:0;
    margin:0 auto 2.5rem;
    background:linear-gradient(to right,transparent,var(--bronzo),transparent);
    opacity:0;
    animation:entra 1.6s ease-out .9s forwards;
  }

  .contatto{
    margin:0;
    opacity:0;
    animation:entra 1.6s ease-out 1.2s forwards;
  }

  .contatto a{
    font-size:clamp(.95rem,2.4vw,1.15rem);
    letter-spacing:.06em;
    color:var(--bronzo-chiaro);
    text-decoration:none;
    border-bottom:1px solid rgba(176,129,68,.35);
    padding-bottom:2px;
    transition:color .3s ease,border-color .3s ease;
  }
  .contatto a:hover,.contatto a:focus-visible{
    color:#f0dcb8;
    border-bottom-color:#f0dcb8;
  }

  @keyframes entra{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }

  @media (prefers-reduced-motion:reduce){
    .logo,.claim,.riga,.contatto{animation:none;opacity:1}
  }
</style>
</head>
