<!DOCTYPE html>
<!--
  ANOMIA - pagina di attesa
  ---------------------------------------------------------------
  DOVE VA QUESTO FILE
    Nel repository iorana-site, come   anomia/index.html
    Sostituisce quello gia' caricato.

  UN FILE SOLO: l'immagine e' incorporata qui dentro, su fondo
  trasparente, quindi non si vede piu' il riquadro scuro.

  COSA CAMBIARE, e dove:
    - la frase       cerca   <p class="frase">
    - l'indirizzo    cerca   info@iorana.it
    - il titolo della finestra del browser   cerca   <title>
    - quando la pagina sara' pubblica, togli la riga con  noindex
-->

<style>
  /* Carattere EB Garamond ospitato sul sito (nessuna connessione a Google) */
  @font-face{font-family:"EB Garamond";font-style:normal;font-weight:400;font-display:swap;src:url("../fonts/EBGaramond-Regular.woff") format("woff")}
  @font-face{font-family:"EB Garamond";font-style:normal;font-weight:500;font-display:swap;src:url("../fonts/EBGaramond-Medium.woff") format("woff")}
  @font-face{font-family:"EB Garamond";font-style:italic;font-weight:400;font-display:swap;src:url("../fonts/EBGaramond-Italic.woff") format("woff")}
  :root{
    --nero:#080808; --bronzo:#b08144; --bronzo-chiaro:#d4a869; --testo:#e8e2d8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:var(--nero); color:var(--testo);
    font-family:"EB Garamond",Garamond,"Times New Roman",serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem 1.5rem;
  }
  .segno{
    width:clamp(210px,50vw,380px); max-width:100%; height:auto; display:block;
    margin:0 auto 2.2rem; opacity:0; animation:entra 2s ease-out .2s forwards;
  }
  .frase{
    font-size:clamp(1.3rem,4.2vw,2.2rem); font-style:italic; font-weight:400;
    line-height:1.4; margin:0 0 3rem; max-width:20ch;
    opacity:0; animation:entra 2s ease-out .8s forwards;
  }
  .riga{
    width:clamp(70px,14vw,120px); height:1px; border:0; margin:0 auto 2.5rem;
    background:linear-gradient(to right,transparent,var(--bronzo),transparent);
    opacity:0; animation:entra 2s ease-out 1.2s forwards;
  }
  .contatto{margin:0; opacity:0; animation:entra 2s ease-out 1.5s forwards}
  .contatto a{
    font-size:clamp(.95rem,2.4vw,1.12rem); letter-spacing:.06em;
    color:var(--bronzo-chiaro); text-decoration:none;
    border-bottom:1px solid rgba(176,129,68,.35); padding-bottom:2px;
    transition:color .3s ease,border-color .3s ease;
  }
  .contatto a:hover,.contatto a:focus-visible{color:#f0dcb8;border-bottom-color:#f0dcb8}
  @keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.segno,.frase,.riga,.contatto{animation:none;opacity:1}}

  .legale{
    position:fixed;left:0;right:0;
    bottom:max(1rem,env(safe-area-inset-bottom,0px));
    margin:0;text-align:center;
    font-size:.8rem;letter-spacing:.08em;
  }
  .legale a{color:rgba(232,226,216,.45);text-decoration:none}
  .legale a:hover,.legale a:focus-visible{color:var(--bronzo-chiaro)}
</style>
